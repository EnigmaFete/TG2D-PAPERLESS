services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8001:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
      - ./branding:/usr/src/paperless/branding:ro
      - ./branding/apply-branding.sh:/custom-cont-init.d/01-branding.sh:ro
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_APP_LOGO: "/static/logo.png"
      PAPERLESS_APP_TITLE: "T.G.2.D"
      PAPERLESS_URL: "https://gauging-isolated-widely.ngrok-free.dev"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://*.ngrok-free.dev,https://*.ngrok-free.app,https://gauging-isolated-widely.ngrok-free.dev,https://*.trycloudflare.com,https://enigmafete.github.io,http://localhost:8001,http://127.0.0.1:8001,http://192.168.1.15:8001"
      PAPERLESS_ALLOWED_HOSTS: "*"
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://webserver:8000
    depends_on:
      - webserver

volumes:
  data:
  media:
  pgdata:
  redisdata:
